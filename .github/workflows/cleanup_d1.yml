name: Cleanup Cloudflare D1 Database

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Drop All D1 Tables via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute ubereats_monitor --remote --command "DROP VIEW IF EXISTS published_products; DROP VIEW IF EXISTS published_stores; DROP TABLE IF EXISTS alerts_history; DROP TABLE IF EXISTS batch_publications; DROP TABLE IF EXISTS crawl_batches; DROP TABLE IF EXISTS products; DROP TABLE IF EXISTS publication_legacy_baseline; DROP TABLE IF EXISTS publication_migrations; DROP TABLE IF EXISTS store_business_hours; DROP TABLE IF EXISTS store_cuisines; DROP TABLE IF EXISTS stores;"
