name: Uber Crawler

on:
  schedule:
    # 每天台灣時間 早上 06:15、早上 11:15、下午 17:15 (UTC 22:15 (前一日), 03:15, 09:15) 自動執行三次 (避開整點尖峰)
    - cron: '15 22,3,9 * * *'
  workflow_dispatch:
    inputs:
      address:
        description: '爬取基準地址'
        required: false
        default: '台北市士林區中山北路七段'
      max_workers:
        description: '最大並行工作機數量 (上限 15)'
        required: false
        default: '15'

env:
  TZ: 'Asia/Taipei'

concurrency:
  group: ubereats-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # 階段 1: Coordinator 探索周邊並計算動態台數 (min(15, total))
  # ==========================================
  coordinator:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      has_tasks: ${{ steps.gen-matrix.outputs.has_tasks }}
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝基礎依賴
        run: pip install requests

      - name: 探索店家並生成動態分片 Matrix (最多15台)
        id: gen-matrix
        run: |
          python src/coordinator.py --address "${{ github.event.inputs.address || '台北市士林區中山北路七段' }}" --max-workers ${{ github.event.inputs.max_workers || 15 }}

      - name: 暫存分片任務設定檔
        if: steps.gen-matrix.outputs.has_tasks == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: task-chunks
          path: tasks/
          retention-days: 1

  # ==========================================
  # 階段 2: 分散式平行工作機集群 (動態 1 ~ 15 台獨立 IP)
  # ==========================================
  workers:
    needs: coordinator
    if: needs.coordinator.result == 'success' && needs.coordinator.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.coordinator.outputs.matrix) }}
      max-parallel: 15     # 允許最多 15 台機器同時開跑
      fail-fast: true      # 嚴格檢核模式：任一工作機失敗即報錯中斷
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝爬蟲依賴
        run: pip install requests

      - name: 下載分片任務設定
        uses: actions/download-artifact@v8.0.1
        with:
          name: task-chunks
          path: tasks/

      - name: 執行採集任務與產出檢核 (Worker ${{ matrix.chunk_id }})
        run: |
          python src/worker_scraper.py --chunk-file "tasks/chunk_${{ matrix.chunk_id }}.json" --output-dir "output_worker_${{ matrix.chunk_id }}"

      - name: 上傳本節點 JSON 結果
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chunk-result-${{ matrix.chunk_id }}
          path: output_worker_${{ matrix.chunk_id }}/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # 階段 3: 彙整所有 JSON ➔ 推送 HF 資料湖 & 導出靜態快照
  # ==========================================
  reducer:
    needs: [coordinator, workers]
    if: needs.coordinator.result == 'success' && needs.workers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 下載所有 Worker 的 JSON 結果
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: chunk-result-*
          path: all_json_lake/
          merge-multiple: true

      - name: 驗證下載之 JSON 資料湖檔案
        run: |
          file_count=$(ls -1 all_json_lake/*.json 2>/dev/null | wc -l)
          echo "📦 已收集到 $file_count 個原始 JSON 檔案"
          if [ "$file_count" -le 0 ]; then
            echo "❌ 【檢核失敗】：未收集到任何有效 JSON 檔案！"
            exit 1
          fi

      - name: 安裝同步工具
        run: pip install huggingface_hub requests

      - name: ① 推送原始 JSON 至 Hugging Face Datasets (資料湖)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python src/upload_to_hf.py --src-dir all_json_lake/ --repo-id "${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}" --path-in-repo "Json"

      - name: ② 導出邊緣靜態快照資料集 (Plan C Jamstack)
        run: |
          python src/export_static_snapshots.py \
            --src-dir all_json_lake/ \
            --output-dir web/data \
            --scope regional

      - name: ③ 自動提交發布最新靜態資料 (GitHub Pages)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add web/data/ web/version.json web/dashboard_data.js web/dashboard_data.json
          git commit -m "chore(data): auto-publish regional snapshot [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or succeeded"

