name: Uber Crawler

on:
  schedule:
    # 每天台灣時間 早上 06:00、早上 11:00、下午 17:00 (UTC 22:00 (前一日), 03:00, 09:00) 自動執行三次
    - cron: '0 22,3,9 * * *'
  workflow_dispatch:
    inputs:
      address:
        description: '爬取基準地址'
        required: false
        default: '台北市士林區中山北路七段'
      max_workers:
        description: '最大並行工作機數量 (上限 15)'
        required: false
        default: '15'

env:
  TZ: 'Asia/Taipei'

jobs:
  # ==========================================
  # 階段 1: Coordinator 探索周邊並計算動態台數 (min(15, total))
  # ==========================================
  coordinator:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      has_tasks: ${{ steps.gen-matrix.outputs.has_tasks }}
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝基礎依賴
        run: pip install requests

      - name: 探索店家並生成動態分片 Matrix (最多15台)
        id: gen-matrix
        run: |
          python scr/coordinator.py --address "${{ github.event.inputs.address || '台北市士林區中山北路七段' }}" --max-workers ${{ github.event.inputs.max_workers || 15 }}

      - name: 暫存分片任務設定檔
        if: steps.gen-matrix.outputs.has_tasks == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task-chunks
          path: tasks/
          retention-days: 1

  # ==========================================
  # 階段 2: 分散式平行工作機集群 (動態 1 ~ 15 台獨立 IP)
  # ==========================================
  workers:
    needs: coordinator
    if: needs.coordinator.result == 'success' && needs.coordinator.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.coordinator.outputs.matrix) }}
      max-parallel: 15     # 允許最多 15 台機器同時開跑
      fail-fast: true      # 嚴格檢核模式：任一工作機失敗即報錯中斷
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝爬蟲依賴
        run: pip install requests

      - name: 下載分片任務設定
        uses: actions/download-artifact@v4
        with:
          name: task-chunks
          path: tasks/

      - name: 執行採集任務與產出檢核 (Worker ${{ matrix.chunk_id }})
        run: |
          python scr/worker_scraper.py --chunk-file "tasks/chunk_${{ matrix.chunk_id }}.json" --output-dir "output_worker_${{ matrix.chunk_id }}"

      - name: 上傳本節點 JSON 結果
        uses: actions/upload-artifact@v4
        with:
          name: chunk-result-${{ matrix.chunk_id }}
          path: output_worker_${{ matrix.chunk_id }}/
          retention-days: 1

  # ==========================================
  # 階段 3: 彙整所有 JSON ➔ 推送 HF 資料湖 & Cloudflare D1
  # ==========================================
  reducer:
    needs: [coordinator, workers]
    if: needs.coordinator.result == 'success' && needs.workers.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 下載所有 Worker 的 JSON 結果
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-result-*
          path: all_json_lake/
          merge-multiple: true

      - name: 驗證下載之 JSON 資料湖檔案
        run: |
          file_count=$(ls -1 all_json_lake/*.json 2>/dev/null | wc -l)
          echo "📦 已收集到 $file_count 個原始 JSON 檔案"
          if [ "$file_count" -le 0 ]; then
            echo "❌ 【檢核失敗】：未收集到任何有效 JSON 檔案！"
            exit 1
          fi

      - name: 安裝同步工具
        run: |
          pip install huggingface_hub requests
          npm install -g wrangler

      - name: ① 推送原始 JSON 至 Hugging Face Datasets (資料湖)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python scr/upload_to_hf.py --src-dir all_json_lake/ --repo-id "${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}" --path-in-repo "Json"

      - name: ② 執行 ETL 並將資料同步至 Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python scr/json_to_cf_d1.py --src-dir all_json_lake/ --db-name "ubereats_monitor" --require-d1


