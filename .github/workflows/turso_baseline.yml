name: Build and Publish Turso Baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with: { python-version: '3.11' }
      - run: pip install huggingface_hub
      - run: npm install --no-save @libsql/client better-sqlite3
      - name: Resolve and download latest complete Raw snapshot
        id: raw
        run: |
          python - <<'PY'
          import os,re
          from huggingface_hub import HfApi,hf_hub_download
          repo=os.environ['HF_REPO_ID']; token=os.environ['HF_TOKEN']
          files=HfApi(token=token).list_repo_files(repo,repo_type='dataset')
          candidates=sorted(p for p in files if re.fullmatch(r'TaiwanMenuSnapshots/(20\d{12})/taiwan_menus_\1\.tar\.gz',p))
          if not candidates: raise SystemExit('No complete raw snapshot found')
          path=candidates[-1]; batch=path.split('/')[1]
          local=hf_hub_download(repo,filename=path,repo_type='dataset',token=token,local_dir='raw')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'batch={batch}\nsource={local}\n')
          print(path)
          PY
      - uses: actions/cache/restore@v4
        id: baseline-cache
        with:
          path: serving.db
          key: serving-db-${{ steps.raw.outputs.batch }}
      - name: Build normalized SQLite baseline
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: python src/serving_state.py --source "${{ steps.raw.outputs.source }}" --database serving.db --batch-id "${{ steps.raw.outputs.batch }}" --baseline
      - name: Validate baseline and COSTCO search
        run: |
          python - <<'PY'
          import sqlite3,time,os
          c=sqlite3.connect('serving.db'); t=time.perf_counter()
          stores=c.execute('select count(*) from stores').fetchone()[0]
          products=c.execute('select count(*) from products').fetchone()[0]
          events=c.execute('select count(*) from events').fetchone()[0]
          costco=c.execute("select count(*) from product_search where product_search match 'costco'").fetchone()[0]
          elapsed=(time.perf_counter()-t)*1000
          if not stores or not products or events: raise SystemExit(f'invalid baseline stores={stores} products={products} events={events}')
          print(f'stores={stores:,} products={products:,} baseline_events={events} costco={costco:,} query_ms={elapsed:.1f} db_bytes={os.path.getsize("serving.db"):,}')
          PY
      - uses: actions/cache/save@v4
        with:
          path: serving.db
          key: serving-db-${{ steps.raw.outputs.batch }}
      - name: Publish to Turso and verify remote counts
        run: node scripts/publish_turso.mjs serving.db
