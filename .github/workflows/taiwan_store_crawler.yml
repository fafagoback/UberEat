name: Taiwan Uber Eats Stores & Menu Pipeline (15 Workers)

on:
  schedule:
    # 每天台灣時間 早上 06:30 與 晚上 18:30 (UTC 22:30 (前一日), 10:30) 自動執行兩次全台大採集
    - cron: '30 22,10 * * *'
  workflow_dispatch:
    inputs:
      scan_file:
        description: '掃描基準點 CSV 檔案'
        required: false
        default: 'data/seeds/taiwan_scan_points_3km_land_only.csv'
      max_workers:
        description: '平行工作機台數 (預設 15 台)'
        required: false
        default: '15'
      max_pages_per_point:
        description: '單點店家探索最大翻頁數 (預設 0，無限制直到見底)'
        required: false
        default: '0'

env:
  TZ: 'Asia/Taipei'

# 全台批次共用同一個發布目標；禁止排程與手動執行彼此覆寫。
concurrency:
  group: ubereats-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # Stage 1: Point Coordinator 點位調度節點 (分片 1,558 陸地網格點)
  # ============================================================
  point_coordinator:
    name: "階段 1: 點位調度 (Coordinator)"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      has_tasks: ${{ steps.gen-matrix.outputs.has_tasks }}
      batch_id: ${{ steps.gen-matrix.outputs.batch_id }}
      total_points: ${{ steps.gen-matrix.outputs.total_points }}
      num_workers: ${{ steps.gen-matrix.outputs.num_workers }}
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝基礎依賴
        run: pip install requests

      - name: 執行點位調度與動態 Matrix 生成
        id: gen-matrix
        run: |
          python src/taiwan_crawler_coordinator.py \
            --scan-file "${{ github.event.inputs.scan_file || 'data/seeds/taiwan_scan_points_3km_land_only.csv' }}" \
            --max-workers ${{ github.event.inputs.max_workers || 15 }} \
            --output-dir "tasks"

      - name: 上傳點位分片任務設定 Artifact
        if: steps.gen-matrix.outputs.has_tasks == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: point-task-chunks
          path: tasks/
          retention-days: 1

  # ============================================================
  # Stage 2: 15 台平行工作機全台店家探索 (Store Discovery Matrix)
  # ============================================================
  store_discovery_workers:
    name: "階段 2: 店家探索 Worker ${{ matrix.chunk_id }}"
    needs: point_coordinator
    if: needs.point_coordinator.result == 'success' && needs.point_coordinator.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.point_coordinator.outputs.matrix) }}
      max-parallel: 15
      fail-fast: false
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝爬蟲依賴
        run: pip install requests

      - name: 下載點位分片任務
        uses: actions/download-artifact@v8.0.1
        with:
          name: point-task-chunks
          path: tasks/

      - name: 執行本節點店家探索 (Worker ${{ matrix.chunk_id }})
        run: |
          python src/taiwan_store_worker.py \
            --chunk-file "tasks/chunk_${{ matrix.chunk_id }}.json" \
            --output-dir "output_worker_${{ matrix.chunk_id }}" \
            --max-pages-per-point ${{ github.event.inputs.max_pages_per_point || 0 }} \
            --concurrency 2

      - name: 上傳本節點店家探索成果
        uses: actions/upload-artifact@v7.0.1
        with:
          name: store-chunk-result-${{ matrix.chunk_id }}
          path: output_worker_${{ matrix.chunk_id }}/
          retention-days: 1

  # ============================================================
  # Stage 3: 全台店家全局去重、HF資料集上傳與菜單任務調度 (Reducer & Dispatcher)
  # ============================================================
  store_reducer_and_menu_dispatcher:
    name: "階段 3: 全台去重與菜單調度 (Reducer)"
    needs: [point_coordinator, store_discovery_workers]
    if: needs.point_coordinator.result == 'success' && needs.store_discovery_workers.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      menu_matrix: ${{ steps.run-reducer.outputs.menu_matrix }}
      has_menu_tasks: ${{ steps.run-reducer.outputs.has_menu_tasks }}
      total_unique_stores: ${{ steps.run-reducer.outputs.total_unique_stores }}
      batch_id: ${{ steps.run-reducer.outputs.batch_id }}
      num_menu_workers: ${{ steps.run-reducer.outputs.num_menu_workers }}
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: pip install huggingface_hub requests

      - name: 下載所有 Worker 的店家探索結果
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: store-chunk-result-*
          path: all_store_discovery_outputs/
          merge-multiple: true

      - name: 執行全台去重、HF 店家清單推送與 15 組菜單任務分片生成
        id: run-reducer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python src/taiwan_store_reducer.py \
            --src-dir "all_store_discovery_outputs" \
            --output-dir "taiwan_stores_dataset" \
            --menu-tasks-dir "menu_tasks" \
            --max-menu-workers ${{ github.event.inputs.max_workers || 15 }} \
            --expected-store-workers ${{ needs.point_coordinator.outputs.num_workers }} \
            --repo-id "${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}" \
            --path-in-repo "TaiwanStores"

      - name: 上傳全台店家完整資料集 Artifact (90天留存)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: taiwan-stores-full-dataset
          path: taiwan_stores_dataset/
          retention-days: 90

      - name: 上傳菜單採集任務分片 Artifact
        if: steps.run-reducer.outputs.has_menu_tasks == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: menu-task-chunks
          path: menu_tasks/
          retention-days: 1

  # ============================================================
  # Stage 4: 15 台平行工作機全台菜單採集與 Artifact 產出 (Menu Scraper Matrix)
  # ============================================================
  menu_scraper_workers:
    name: "階段 4: 菜單 Worker ${{ matrix.chunk_id }}"
    needs: store_reducer_and_menu_dispatcher
    if: needs.store_reducer_and_menu_dispatcher.result == 'success' && needs.store_reducer_and_menu_dispatcher.outputs.has_menu_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.store_reducer_and_menu_dispatcher.outputs.menu_matrix) }}
      max-parallel: 15
      fail-fast: false
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝爬蟲依賴
        run: pip install requests

      - name: 下載菜單採集任務設定
        uses: actions/download-artifact@v8.0.1
        with:
          name: menu-task-chunks
          path: menu_tasks/

      - name: 執行菜單採集並產出 Artifact 來源 (Worker ${{ matrix.chunk_id }})
        run: |
          python src/taiwan_menu_worker.py \
            --chunk-file "menu_tasks/chunk_${{ matrix.chunk_id }}.json" \
            --output-dir "output_menu_worker_${{ matrix.chunk_id }}" \
            --concurrency 5

      - name: 上傳本節點菜單 JSON 結果 Artifact (雙重保險)
        id: upload-menu-artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: menu-result-chunk-${{ matrix.chunk_id }}
          path: output_menu_worker_${{ matrix.chunk_id }}/
          if-no-files-found: error
          retention-days: 14

      - name: 寫入 Stage 4 Artifact Checkpoint
        if: always()
        shell: bash
        env:
          ARTIFACT_OUTCOME: ${{ steps.upload-menu-artifact.outcome }}
        run: |
          if [[ "$ARTIFACT_OUTCOME" == "success" ]]; then status="✅"; actual="上傳成功，保留 14 天"; else status="❌"; actual="${ARTIFACT_OUTCOME:-未執行}"; fi
          {
            echo "### Stage 4 Artifact Checkpoint"
            echo "| 檢核項目 | 通過標準 | 實際結果 | 狀態 |"
            echo "| :--- | :--- | :--- | :---: |"
            echo "| Worker Artifact | 成功上傳且可供 Stage 5 下載 | $actual | $status |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ARTIFACT_OUTCOME" == "success" ]]

  # ============================================================
  # Stage 5: 彙整所有菜單 Artifact、單檔壓縮與 Hugging Face 單次 Commit
  # ============================================================
  package_and_archive_menu_snapshot:
    name: "階段 5: 菜單完整快照封存與 HF 單次 Commit"
    needs: [store_reducer_and_menu_dispatcher, menu_scraper_workers]
    if: needs.store_reducer_and_menu_dispatcher.result == 'success' && needs.menu_scraper_workers.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 下載全部 Menu Worker Artifacts（保留分片目錄）
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: menu-result-chunk-*
          path: menu_worker_artifacts/

      - name: 下載全台店家清單供完整率檢核
        uses: actions/download-artifact@v8.0.1
        with:
          name: taiwan-stores-full-dataset
          path: taiwan_stores_dataset/

      - name: 安裝 Hugging Face 上傳工具
        run: pip install huggingface_hub

      - name: 檢核、打包並以單一 Commit 上傳 HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          EXPECTED_WORKERS: ${{ needs.store_reducer_and_menu_dispatcher.outputs.num_menu_workers }}
          BATCH_ID: ${{ needs.store_reducer_and_menu_dispatcher.outputs.batch_id }}
        shell: bash
        run: |
          set -euo pipefail
          actual_workers="$(find menu_worker_artifacts -mindepth 1 -maxdepth 1 -type d -name 'menu-result-chunk-*' | wc -l | tr -d ' ')"
          python src/package_and_upload_menu_snapshot.py \
            --src-dir menu_worker_artifacts/ \
            --stores-file taiwan_stores_dataset/taiwan_all_stores.json \
            --output-dir packaged_snapshot/ \
            --batch-id "$BATCH_ID" \
            --expected-workers "$EXPECTED_WORKERS" \
            --actual-workers "$actual_workers" \
            --repo-id "${HF_REPO_ID:-hub-google/UberEat}" \
            --path-in-repo "TaiwanMenuSnapshots"

      - name: 保存 Stage 5 壓縮快照 Artifact（供補跑與稽核）
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: taiwan-menu-snapshot-${{ needs.store_reducer_and_menu_dispatcher.outputs.batch_id }}
          path: packaged_snapshot/
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # Stage 6: normalized CURRENT/EVENTS build and Pages publish
  # ============================================================
  static_snapshot_and_publish:
    name: "階段 6: Serving DB 驗證與 Pages 發布"
    timeout-minutes: 120
    needs: [store_reducer_and_menu_dispatcher, menu_scraper_workers, package_and_archive_menu_snapshot]
    if: needs.store_reducer_and_menu_dispatcher.result == 'success' && needs.menu_scraper_workers.result == 'success' && needs.package_and_archive_menu_snapshot.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 安裝 Serving 與 HF 依賴
        run: pip install huggingface_hub

      - name: 安裝 Turso Node client
        run: npm install --no-save @libsql/client better-sqlite3

      - name: 還原上一批 Current/Event state
        id: serving-cache
        uses: actions/cache@v4
        with:
          path: serving.db
          key: serving-db-rebuilt-${{ needs.store_reducer_and_menu_dispatcher.outputs.batch_id }}
          restore-keys: |
            serving-db-rebuilt-

      - name: 拒絕未經全快照重建的舊 baseline
        shell: bash
        run: |
          python - <<'PY'
          import os,sqlite3
          if not os.path.exists('serving.db'):
              raise SystemExit('No full-history serving DB cache. Run Rebuild Turso From All HF Snapshots first.')
          c=sqlite3.connect('serving.db')
          marker=c.execute("select value from metadata where key='rebuild_snapshot_count'").fetchone()
          if not marker or int(marker[0]) < 3:
              raise SystemExit('Refusing legacy latest-snapshot baseline; full-history rebuild marker is absent.')
          print(f'full-history cache verified: {marker[0]} snapshots')
          PY

      - name: ① 依序補齊 HF 所有尚未處理的完整快照
        env:
          MISSING_STREAK_THRESHOLD: ${{ vars.MISSING_STREAK_THRESHOLD || '3' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}
        run: |
          python src/sync_database_from_hf.py --database serving.db --repo-id "$HF_REPO_ID" \
            --missing-threshold "$MISSING_STREAK_THRESHOLD" --event-retention-days 60

      - name: 顯示同步後 runner 資源
        shell: bash
        run: |
          free -h
          df -h .
          du -h serving.db serving.db-wal serving.db-shm 2>/dev/null || true

      - name: ② Serving DB 本地完整性驗證
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('serving.db')
          stores=c.execute('select count(*) from stores').fetchone()[0]
          products=c.execute('select count(*) from products').fetchone()[0]
          if not stores or not products: raise SystemExit('empty serving database')
          print(f'validated stores={stores:,} products={products:,}')
          PY

      - name: ③ 發布 Current/Events 到 Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_ACTIVE_SCHEMA_VERSION: ${{ vars.TURSO_ACTIVE_SCHEMA_VERSION }}
        run: |
          if [[ "$TURSO_ACTIVE_SCHEMA_VERSION" != "v10" ]]; then
            echo 'Turso v10 cutover is not enabled: rebuilt local state was validated, remote publish safely skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$TURSO_DATABASE_URL" || -z "$TURSO_AUTH_TOKEN" ]]; then
            echo 'Turso credentials absent: local SQLite validation succeeded; publish safely skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/publish_turso.mjs serving.db
          fi

      - name: ④ Raw/Event 60-day retention dry-run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID || 'hub-google/UberEat' }}
        run: python src/hf_retention.py --repo-id "$HF_REPO_ID"

      - name: 壓縮下一批使用的狀態 checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('serving.db')
          c.execute('DROP TABLE IF EXISTS product_search')
          c.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          c.execute('VACUUM')
          c.close()
          PY
          du -h serving.db

      - name: ⑤ 設定 GitHub Pages 環境
        uses: actions/configure-pages@v5

      - name: ⑥ 上傳 Pages 靜態網站產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: ⑦ 部署發布至 GitHub Pages (即時生效)
        id: deployment
        uses: actions/deploy-pages@v4
