name: UberEat 02｜HF 60 天資料與歷史清理

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 僅預覽清理計畫，不實際刪除
        type: boolean
        default: false
  schedule:
    - cron: '10 21 * * *'
  workflow_run:
    workflows: ['UberEat 01｜全台原始資料爬蟲']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ubereats-production
  cancel-in-progress: false

jobs:
  retention:
    name: 刪除過期 Raw 與 HF Git/LFS 歷史版本
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: 檢出專案
        uses: actions/checkout@v7.0.1
      - name: 設定 Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: 安裝 Hugging Face API
        run: pip install 'huggingface_hub>=0.30,<2'
      - name: 檢查並自動清除 60 天前資料及歷史版本
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "1" ]; then
            python src/hf_retention.py --repo-id hub-google/UberEat --days 60
          else
            python src/hf_retention.py --repo-id hub-google/UberEat --days 60 --apply
          fi
